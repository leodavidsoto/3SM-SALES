[project]
name = "autoshorts"
version = "0.1.0"
description = "Daily viral-clip pipeline: Whisper + Gemini Flash + Upload-Post"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.3",
    "google-genai>=0.8.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "Pillow>=10.0.0",
]

[project.scripts]
autoshorts = "autoshorts.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoshorts"]
